<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telemetría Camión Minero - ESP32</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 14px;
      background-color: #0f172a; color: #f8fafc;
      display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 460px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #1e293b;
    }
    h1 { font-size: 1.15rem; margin: 0; }
    .badge {
      padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700;
      background: #ef4444; color: #fff;
    }
    .badge.online { background: #10b981; }

    /* Visor de inclinación del camión */
    .truck-stage {
      background: #1e293b; border-radius: 12px; padding: 14px 12px 10px;
      margin-bottom: 12px; border: 1px solid #334155; text-align: center;
      position: relative; overflow: hidden;
    }
    .truck-wrap {
      height: 115px; display: flex; align-items: center; justify-content: center;
    }
    #truckImg {
      max-height: 98px; max-width: 80%; object-fit: contain;
      transition: transform 0.2s ease-out;
      transform: rotate(0deg);
    }
    .horizon-line {
      width: 85%; height: 2px; background: #475569; margin: 0 auto 6px;
      position: relative;
    }
    .tilt-caption { font-size: 0.82rem; color: #94a3b8; }

    /* Tarjeta de estado principal */
    .status-card {
      background: #1e293b; border-radius: 12px; padding: 14px;
      margin-bottom: 12px; text-align: center; border: 2px solid #10b981;
    }
    .status-card.alerta { background: #422006; border-color: #f59e0b; }
    .status-card.falla  { background: #450a0a; border-color: #ef4444; }
    .status-title { font-size: 0.78rem; color: #94a3b8; letter-spacing: 0.5px; }
    .status-value { font-size: 1.3rem; font-weight: 800; margin-top: 2px; }
    .status-detail { font-size: 0.85rem; margin-top: 6px; color: #fca5a5; font-weight: 600; }

    /* Cuadrícula de sensores */
    .grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
    }
    .card {
      background: #1e293b; border-radius: 12px; padding: 12px;
      border: 1px solid #334155;
    }
    .card.danger { border-color: #ef4444; background: #2a1215; }
    .card.warn   { border-color: #f59e0b; background: #291d0a; }
    .card-label { font-size: 0.78rem; color: #94a3b8; }
    .card-val { font-size: 1.3rem; font-weight: 700; margin-top: 3px; color: #38bdf8; }
    .card-limit { font-size: 0.7rem; color: #64748b; margin-top: 2px; }

    button {
      width: 100%; padding: 15px; font-size: 1rem; font-weight: 700;
      border: none; border-radius: 12px; cursor: pointer;
      background: #2563eb; color: #fff;
    }
    button:active { background: #1d4ed8; transform: scale(0.99); }

    .feedback {
      margin-top: 10px; padding: 10px; border-radius: 8px;
      font-size: 0.82rem; text-align: center; background: #020617; color: #94a3b8;
    }
    .feedback.ok  { color: #34d399; border: 1px solid #065f46; }
    .feedback.err { color: #fbbf24; border: 1px solid #78350f; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Monitoreo Camión Minero</h1>
      <span id="connStatus" class="badge">Desconectado</span>
    </header>

    <div class="truck-stage">
      <div class="truck-wrap">
        <img id="truckImg" src="camion.png" alt="Camión Minero" />
      </div>
      <div class="horizon-line"></div>
      <div class="tilt-caption">Inclinación visual en tiempo real (Alerta en ±25°)</div>
    </div>

    <div id="statusBox" class="status-card">
      <div class="status-title">ESTADO DEL SISTEMA</div>
      <div id="estadoTexto" class="status-value">ESPERANDO ESP32...</div>
      <div id="motivoTexto" class="status-detail"></div>
    </div>

    <div class="grid">
      <div id="cardDist" class="card">
        <div class="card-label">Distancia Láser</div>
        <div id="valDist" class="card-val">-- mm</div>
        <div class="card-limit">Falla: &lt; 30 mm</div>
      </div>
      <div id="cardCarga" class="card">
        <div class="card-label">Carga (FSR)</div>
        <div id="valCarga" class="card-val">-- N</div>
        <div class="card-limit">Falla: ≥ 8.55 N</div>
      </div>
      <div id="cardVib" class="card">
        <div class="card-label">Vibración</div>
        <div id="valVib" class="card-val">-- g</div>
        <div class="card-limit">Falla: &gt; 0.100 g</div>
      </div>
      <div id="cardInc" class="card">
        <div class="card-label">Inclinación</div>
        <div id="valInc" class="card-val">-- °</div>
        <div class="card-limit">Alerta: ±25.0°</div>
      </div>
    </div>

    <button onclick="enviarReset()">RESETEAR FALLA</button>
    <div id="feedbackBox" class="feedback">Sin comandos enviados</div>
  </div>

  <script>
    // === CONFIGURACIÓN EMQX CLOUD ===
    const BROKER_URL = "wss://t06a6b17.ala.us-east-1.emqxsl.com:8084/mqtt";
    const MQTT_USER  = "web";
    const MQTT_PASS  = "sanroman2013";

    // Tópicos del proyecto
    const TOPIC_TELEMETRIA = "camion/telemetria";
    const TOPIC_CONTROL    = "camion/control";
    const TOPIC_RESPUESTA  = "camion/respuesta";

    const badge = document.getElementById("connStatus");
    const feedbackBox = document.getElementById("feedbackBox");

    const client = mqtt.connect(BROKER_URL, {
      clientId: "web_camion_" + Math.random().toString(16).substring(2, 8),
      username: MQTT_USER,
      password: MQTT_PASS,
      clean: true,
      reconnectPeriod: 3000
    });

    client.on("connect", () => {
      badge.textContent = "Conectado";
      badge.classList.add("online");
      client.subscribe([TOPIC_TELEMETRIA, TOPIC_RESPUESTA]);
    });

    client.on("close", () => {
      badge.textContent = "Desconectado";
      badge.classList.remove("online");
    });

    client.on("message", (topic, message) => {
      const texto = message.toString();

      // Respuesta del ESP32 tras presionar RESET
      if (topic === TOPIC_RESPUESTA) {
        feedbackBox.textContent = texto;
        feedbackBox.className = texto.includes("EXITOSO") ? "feedback ok" : "feedback err";
        return;
      }

      // Datos periódicos de los sensores
      if (topic === TOPIC_TELEMETRIA) {
        try {
          const d = JSON.parse(texto);
          const dist  = Number(d.dist);
          const carga = Number(d.carga);
          const vib   = Number(d.vib);
          const inc   = Number(d.inc);

          document.getElementById("valDist").textContent  = dist + " mm";
          document.getElementById("valCarga").textContent = carga.toFixed(2) + " N";
          document.getElementById("valVib").textContent   = vib.toFixed(3) + " g";
          document.getElementById("valInc").textContent   = inc.toFixed(1) + " °";

          // Rotar imagen del camión según inclinación
          document.getElementById("truckImg").style.transform = `rotate(${inc}deg)`;

          // Resaltar tarjetas individuales según tus umbrales
          document.getElementById("cardDist").className  = dist < 30 ? "card danger" : "card";
          document.getElementById("cardCarga").className = carga >= 8.55 ? "card danger" : "card";
          document.getElementById("cardVib").className   = vib > 0.1 ? "card danger" : "card";
          document.getElementById("cardInc").className   = Math.abs(inc) >= 25.0 ? "card warn" : "card";

          // Estado general y diagnóstico
          const statusBox   = document.getElementById("statusBox");
          const estadoTexto = document.getElementById("estadoTexto");
          const motivoTexto = document.getElementById("motivoTexto");

          if (d.falla === true) {
            statusBox.className = "status-card falla";
            estadoTexto.textContent = "EMERGENCIA - MOTOR DETENIDO";
            motivoTexto.textContent = d.motivo || "Falla crítica detectada";
          } else if (Math.abs(inc) >= 25.0) {
            statusBox.className = "status-card alerta";
            estadoTexto.textContent = "ALERTA DE INCLINACIÓN";
            motivoTexto.textContent = "Motor activo en ángulo límite (≥ ±25°)";
          } else {
            statusBox.className = "status-card";
            estadoTexto.textContent = "OK - MOTOR EN MARCHA";
            motivoTexto.textContent = "";
          }
        } catch (e) {
          console.error("JSON inválido:", texto);
        }
      }
    });

    function enviarReset() {
      if (client.connected) {
        client.publish(TOPIC_CONTROL, "RESET");
        feedbackBox.className = "feedback";
        feedbackBox.textContent = "Enviando solicitud de RESET al ESP32...";
      } else {
        alert("No estás conectado al broker MQTT.");
      }
    }
  </script>
</body>
</html>
