<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telemetría Camión Minero - ESP32</title>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 14px;
      background-color: #0f172a; color: #f8fafc;
      display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 460px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #1e293b;
    }
    h1 { font-size: 1.15rem; margin: 0; }
    .badge {
      padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700;
      background: #ef4444; color: #fff;
    }
    .badge.online { background: #10b981; }

    /* Imagen fija del camión (no rota) */
    .truck-stage {
      background: #1e293b; border-radius: 12px; padding: 14px 12px 10px;
      margin-bottom: 12px; border: 1px solid #334155; text-align: center;
    }
    .truck-wrap { height: 115px; display: flex; align-items: center; justify-content: center; }
    #truckImg { max-height: 98px; max-width: 80%; object-fit: contain; }
    .tilt-caption { font-size: 0.82rem; color: #94a3b8; margin-top: 8px; }

    /* Estado general: paro de emergencia / alerta / normal / sin datos */
    .status-card {
      background: #1e293b; border-radius: 12px; padding: 14px;
      margin-bottom: 10px; text-align: center; border: 2px solid #10b981;
    }
    .status-card.alerta  { background: #422006; border-color: #f59e0b; }
    .status-card.falla   { background: #450a0a; border-color: #ef4444; }
    .status-card.sindatos { background: #1e293b; border-color: #64748b; }
    .status-title { font-size: 0.78rem; color: #94a3b8; letter-spacing: 0.5px; }
    .status-value { font-size: 1.3rem; font-weight: 800; margin-top: 2px; }
    .status-detail { font-size: 0.85rem; margin-top: 6px; color: #94a3b8; font-weight: 600; }
    .status-card.alerta .status-detail { color: #fcd34d; }
    .status-card.falla .status-detail   { color: #fca5a5; }

    /* Estado del motor (aparte del paro) */
    .motor-card {
      background: #1e293b; border-radius: 12px; padding: 12px 14px;
      margin-bottom: 12px; border: 1px solid #334155;
      display: flex; justify-content: space-between; align-items: center;
    }
    .motor-card.activo { border-color: #38bdf8; }
    .motor-label { font-size: 0.78rem; color: #94a3b8; }
    .motor-val { font-size: 1.1rem; font-weight: 800; }

    /* Sensores */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .card { background: #1e293b; border-radius: 12px; padding: 12px; border: 1px solid #334155; }
    .card.danger { border-color: #ef4444; background: #2a1215; }
    .card.warn   { border-color: #f59e0b; background: #291d0a; }
    .card-label { font-size: 0.78rem; color: #94a3b8; }
    .card-val { font-size: 1.3rem; font-weight: 700; margin-top: 3px; color: #38bdf8; }
    .card-limit { font-size: 0.7rem; color: #64748b; margin-top: 2px; }

    /* Control de movimiento */
    .control {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 12px; margin-bottom: 12px;
    }
    .arrows { display: flex; gap: 10px; }
    .arrow {
      flex: 1; height: 84px; font-size: 2.2rem; border: none; border-radius: 12px;
      background: #334155; color: #f8fafc; cursor: pointer;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .arrow.activo { background: #10b981; }
    .arrow:disabled { background: #0f172a; color: #475569; cursor: not-allowed; }
    .control-hint { font-size: 0.72rem; color: #64748b; margin-top: 8px; text-align: center; }

    .btn-reset {
      width: 100%; padding: 15px; font-size: 1rem; font-weight: 700;
      border: none; border-radius: 12px; cursor: pointer;
      background: #2563eb; color: #fff;
    }
    .btn-reset:active { background: #1d4ed8; }
    .btn-reset:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

    .feedback {
      margin-top: 10px; padding: 10px; border-radius: 8px;
      font-size: 0.82rem; text-align: center; background: #020617; color: #94a3b8;
    }
    .feedback.ok  { color: #34d399; border: 1px solid #065f46; }
    .feedback.err { color: #fbbf24; border: 1px solid #78350f; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Monitoreo Camión Minero</h1>
      <span id="connStatus" class="badge">Desconectado</span>
    </header>

    <div class="truck-stage">
      <div class="truck-wrap">
        <img id="truckImg" src="camion.png" alt="Camión Minero" />
      </div>
      <div id="tiltCaption" class="tilt-caption">Inclinación: --</div>
    </div>

    <div id="statusBox" class="status-card sindatos">
      <div class="status-title">ESTADO DEL SISTEMA</div>
      <div id="estadoTexto" class="status-value">ESPERANDO ESP32...</div>
      <div id="motivoTexto" class="status-detail"></div>
    </div>

    <div id="motorBox" class="motor-card">
      <div>
        <div class="motor-label">Motor</div>
        <div id="motorTexto" class="motor-val">--</div>
      </div>
    </div>

    <div class="grid">
      <div id="cardDist" class="card">
        <div class="card-label">Distancia Láser</div>
        <div id="valDist" class="card-val">-- mm</div>
        <div id="limDist" class="card-limit"></div>
      </div>
      <div id="cardCarga" class="card">
        <div class="card-label">Carga (FSR)</div>
        <div id="valCarga" class="card-val">-- N</div>
        <div id="limCarga" class="card-limit"></div>
      </div>
      <div id="cardVib" class="card">
        <div class="card-label">Vibración</div>
        <div id="valVib" class="card-val">-- g</div>
        <div id="limVib" class="card-limit"></div>
      </div>
      <div id="cardInc" class="card">
        <div class="card-label">Inclinación</div>
        <div id="valInc" class="card-val">-- °</div>
        <div id="limInc" class="card-limit"></div>
      </div>
    </div>

    <div class="control">
      <div class="arrows">
        <button id="btnAdelante" class="arrow" disabled aria-label="Avanzar">&#9650;</button>
        <button id="btnAtras" class="arrow" disabled aria-label="Retroceder">&#9660;</button>
      </div>
      <div class="control-hint">Mantén presionada una flecha para mover (también teclas ↑ ↓)</div>
    </div>

    <button id="btnReset" class="btn-reset" disabled>RESETEAR PARO</button>
    <div id="feedbackBox" class="feedback">Sin comandos enviados</div>
  </div>

  <script>
    // === CONFIGURACIÓN EMQX CLOUD ===
    const BROKER_URL = "wss://t06a6b17.ala.us-east-1.emqxsl.com:8084/mqtt";
    const MQTT_USER  = "web";
    const MQTT_PASS  = "sanroman2013";

    // Tópicos del proyecto
    const TOPIC_TELEMETRIA = "camion/telemetria";
    const TOPIC_CONTROL    = "camion/control";
    const TOPIC_RESPUESTA  = "camion/respuesta";

    // Límites solo para colorear tarjetas (el ESP32 decide el paro)
    const LIM = { dist: 30, carga: 8.55, vib: 0.1, inc: 25 };
    const TIMEOUT_DATOS = 5000;  // ms sin telemetría -> SIN DATOS
    const PERIODO_CMD   = 300;   // ms entre comandos de movimiento
    const TIMEOUT_RESET = 5000;  // ms de espera de respuesta al RESET
    const NOMBRE_CAUSA = {
      CARGA: "Exceso de carga",
      VIBRACION: "Exceso de vibración",
      OBJETO: "Objeto cercano"
    };

    const $ = (id) => document.getElementById(id);
    const badge = $("connStatus");
    const feedbackBox = $("feedbackBox");
    const btnAdelante = $("btnAdelante");
    const btnAtras = $("btnAtras");
    const btnReset = $("btnReset");
    const BOTON_DIR = { AVANZAR: btnAdelante, RETRO: btnAtras };

    // Estado de la página
    let ultimoDato = 0;
    let datosOk = false;
    let paro = false;
    let dirActiva = null;
    let timerCmd = null;
    let timerReset = null;
    let resetBloqueado = false;

    // Textos de límites
    $("limDist").textContent  = "Falla: < " + LIM.dist + " mm";
    $("limCarga").textContent = "Falla: ≥ " + LIM.carga + " N";
    $("limVib").textContent   = "Falla: > " + LIM.vib.toFixed(3) + " g";
    $("limInc").textContent   = "Alerta: ±" + LIM.inc.toFixed(1) + "°";

    const client = mqtt.connect(BROKER_URL, {
      clientId: "web_camion_" + Math.random().toString(16).substring(2, 8),
      username: MQTT_USER,
      password: MQTT_PASS,
      clean: true,
      reconnectPeriod: 3000
    });

    client.on("connect", () => {
      badge.textContent = "Conectado";
      badge.classList.add("online");
      client.subscribe([TOPIC_TELEMETRIA, TOPIC_RESPUESTA]);
      actualizarControles();
    });

    client.on("close", () => {
      badge.textContent = "Desconectado";
      badge.classList.remove("online");
      sinDatos();
    });

    client.on("message", (topic, message) => {
      const texto = message.toString();

      // Respuesta del ESP32 tras presionar RESET
      if (topic === TOPIC_RESPUESTA) {
        clearTimeout(timerReset);
        resetBloqueado = false;
        feedback(texto, texto.includes("EXITOSO") ? "ok" : "err");
        actualizarControles();
        return;
      }

      // Telemetría periódica
      if (topic === TOPIC_TELEMETRIA) {
        let d;
        try { d = JSON.parse(texto); }
        catch (e) { console.error("JSON inválido:", texto); return; }
        ultimoDato = Date.now();
        datosOk = true;
        mostrar(d);
      }
    });

    // Formatea número o "--" si no es válido
    function num(v, dec) {
      const n = Number(v);
      return Number.isFinite(n) ? n.toFixed(dec) : "--";
    }

    function setEstado(clase, titulo, detalle) {
      $("statusBox").className = "status-card " + clase;
      $("estadoTexto").textContent = titulo;
      $("motivoTexto").textContent = detalle;
    }

    function feedback(texto, clase) {
      feedbackBox.textContent = texto;
      feedbackBox.className = "feedback " + (clase || "");
    }

    function mostrar(d) {
      const dist = Number(d.dist), carga = Number(d.carga);
      const vib = Number(d.vib), inc = Number(d.inc);

      $("valDist").textContent  = num(d.dist, 0) + " mm";
      $("valCarga").textContent = num(d.carga, 2) + " N";
      $("valVib").textContent   = num(d.vib, 3) + " g";
      $("valInc").textContent   = num(d.inc, 1) + " °";
      $("tiltCaption").textContent = "Inclinación: " + num(d.inc, 1) + "°";

      // Tarjetas resaltadas según la lectura actual
      $("cardDist").className  = dist < LIM.dist ? "card danger" : "card";
      $("cardCarga").className = carga >= LIM.carga ? "card danger" : "card";
      $("cardVib").className   = vib > LIM.vib ? "card danger" : "card";
      $("cardInc").className   = Math.abs(inc) >= LIM.inc ? "card warn" : "card";

      // Estado general
      paro = d.paro === true;
      const causas = Array.isArray(d.causas) ? d.causas : [];
      const alertaInc = d.alerta_inc === true;

      if (paro) {
        let detalle = causas.map((c) => NOMBRE_CAUSA[c] || c).join(" · ") || "Falla detectada";
        if (alertaInc) detalle += " | Además: inclinación elevada";
        setEstado("falla", "PARO DE EMERGENCIA", detalle);
      } else if (alertaInc) {
        setEstado("alerta", "ALERTA DE INCLINACIÓN", "Inclinación elevada. El motor sigue activo");
      } else {
        setEstado("", "SISTEMA NORMAL", "");
      }

      // Estado del motor (aparte del paro)
      const motor = String(d.motor || "DETENIDO");
      const etiqueta = { DETENIDO: "DETENIDO", AVANZANDO: "▲ AVANZANDO", RETROCEDIENDO: "▼ RETROCEDIENDO" };
      $("motorTexto").textContent = etiqueta[motor] || motor;
      $("motorBox").className = motor === "DETENIDO" ? "motor-card" : "motor-card activo";

      actualizarControles();
    }

    // Sin telemetría: no se puede afirmar nada del camión
    function sinDatos() {
      datosOk = false;
      paro = false;
      setEstado("sindatos", "SIN DATOS DEL ESP32", "No llega telemetría");
      $("motorTexto").textContent = "--";
      $("motorBox").className = "motor-card";
      $("valDist").textContent = "-- mm";
      $("valCarga").textContent = "-- N";
      $("valVib").textContent = "-- g";
      $("valInc").textContent = "-- °";
      $("tiltCaption").textContent = "Inclinación: --";
      ["cardDist", "cardCarga", "cardVib", "cardInc"].forEach((id) => { $(id).className = "card"; });
      actualizarControles();
    }

    setInterval(() => {
      if (datosOk && Date.now() - ultimoDato > TIMEOUT_DATOS) sinDatos();
    }, 1000);

    // --- Movimiento: flechas manteniendo presionado ---
    function puedeMover() { return client.connected && datosOk && !paro; }

    function actualizarControles() {
      const mover = puedeMover();
      btnAdelante.disabled = !mover;
      btnAtras.disabled = !mover;
      btnReset.disabled = !(client.connected && datosOk && paro) || resetBloqueado;
      if (!mover) detener();
    }

    function iniciar(dir) {
      if (!puedeMover() || dirActiva) return;
      dirActiva = dir;
      BOTON_DIR[dir].classList.add("activo");
      enviarMov();
      timerCmd = setInterval(enviarMov, PERIODO_CMD);
    }

    function enviarMov() {
      if (!dirActiva || !puedeMover()) { detener(); return; }
      client.publish(TOPIC_CONTROL, dirActiva);
    }

    function detener() {
      if (!dirActiva) return;
      clearInterval(timerCmd);
      timerCmd = null;
      BOTON_DIR[dirActiva].classList.remove("activo");
      dirActiva = null;
      if (client.connected) client.publish(TOPIC_CONTROL, "DETENER");
    }

    // Solo detiene si se suelta la flecha que está activa
    function soltar(dir) { if (dirActiva === dir) detener(); }

    function ligar(btn, dir) {
      btn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        btn.setPointerCapture(e.pointerId);
        iniciar(dir);
      });
      ["pointerup", "pointercancel", "lostpointercapture"].forEach((ev) => {
        btn.addEventListener(ev, () => soltar(dir));
      });
      btn.addEventListener("contextmenu", (e) => e.preventDefault());
    }
    ligar(btnAdelante, "AVANZAR");
    ligar(btnAtras, "RETRO");

    // Teclado (computadora): ↑ avanzar, ↓ retroceder
    const TECLAS = { ArrowUp: "AVANZAR", ArrowDown: "RETRO" };
    window.addEventListener("keydown", (e) => {
      const dir = TECLAS[e.key];
      if (dir && !e.repeat) { e.preventDefault(); iniciar(dir); }
    });
    window.addEventListener("keyup", (e) => {
      const dir = TECLAS[e.key];
      if (dir) soltar(dir);
    });

    // Detener si la página pierde el foco o se oculta
    window.addEventListener("blur", detener);
    document.addEventListener("visibilitychange", () => { if (document.hidden) detener(); });

    // --- RESET del paro ---
    btnReset.addEventListener("click", () => {
      if (!client.connected) return;
      client.publish(TOPIC_CONTROL, "RESET", { qos: 1 });
      feedback("Enviando solicitud de RESET al ESP32...", "");
      resetBloqueado = true;
      actualizarControles();
      clearTimeout(timerReset);
      timerReset = setTimeout(() => {
        resetBloqueado = false;
        feedback("El ESP32 no respondió al RESET", "err");
        actualizarControles();
      }, TIMEOUT_RESET);
    });
  </script>
</body>
</html>
